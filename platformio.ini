; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
core_dir = D:/DevTools/.platformio

[env:frdm_kl25z]
platform = freescalekinetis
board = frdm_kl25z
framework = zephyr
platform_packages = platformio/framework-zephyr@~3.40200.0
monitor_speed = 115200

; Upload pelo LinkServer (MCUXpresso) em vez de copiar o .bin para o drive
; DAPLINK: grava o ELF via SWD, reseta a placa e falha de verdade se der erro.
; O comando de upload (LinkServer mais novo em C:/NXP) e o arm-none-eabi-size
; (bloqueado pelo Smart App Control no toolchain do PlatformIO) vem do script.
upload_protocol = custom
extra_scripts = post:mcuxpresso_tools.py

; D-06: as rotinas de teste NAO rodam no boot por padrao.
; Antes eram chamadas sem condicao e custavam 12 min 40 s de sono bloqueante
; em todo boot, antes da primeira leitura de tracking - um reset ao meio-dia
; custava 12 minutos de sol. Descomente para o bringup de bancada:
; build_flags = -DRODAR_TESTES_NO_BOOT
