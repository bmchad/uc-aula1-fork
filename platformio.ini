; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
core_dir = D:/DevTools/.platformio

[env:frdm_kl25z]
platform = freescalekinetis
board = frdm_kl25z
framework = zephyr
platform_packages = platformio/framework-zephyr@~3.40200.0
monitor_speed = 115200

; Upload pelo LinkServer (MCUXpresso) em vez de copiar o .bin para o drive
; DAPLINK: grava o ELF via SWD, reseta a placa e falha de verdade se der erro.
; O comando de upload (LinkServer mais novo em C:/NXP) e o arm-none-eabi-size
; (bloqueado pelo Smart App Control no toolchain do PlatformIO) vem do
; mcuxpresso_tools.py. O zephyr_link_fix.py passa -mcpu/-mthumb ao link: sem
; isso a libgcc em modo ARM derruba o Cortex-M0+ com HardFault no boot.
upload_protocol = custom
extra_scripts =
    post:mcuxpresso_tools.py
    post:zephyr_link_fix.py
